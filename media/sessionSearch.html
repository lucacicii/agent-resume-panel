<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{styleUri}}" />
  </head>
  <body>
    <div class="panel">
      <input
        id="search"
        class="search"
        type="text"
        placeholder="Search title, summary, provider, project, or branch"
        spellcheck="false"
      />
      <section class="projects-section">
        <div class="section-label">Projects</div>
        <div id="chips" class="chips"></div>
      </section>
      <section class="sessions-section">
        <div class="section-label">Sessions</div>
        <div id="sessions" class="sessions"></div>
      </section>
    </div>
    <div id="preview-overlay" class="preview-overlay hidden" aria-hidden="true">
      <div class="preview-card">
        <div class="preview-header">
          <div id="preview-title" class="preview-title"></div>
          <div class="preview-actions">
            <button id="preview-resume" type="button" class="preview-action preview-action-primary" aria-label="Resume session">Resume</button>
            <button id="preview-resume-with" type="button" class="preview-action" aria-label="Resume session with">Resume with…</button>
            <button id="preview-summarize" type="button" class="preview-action hidden" aria-label="Summarize session">Summarize</button>
            <button id="preview-auto-rename" type="button" class="preview-action hidden" aria-label="Auto rename session">Auto Rename</button>
            <button id="preview-rename" type="button" class="preview-action" aria-label="Rename session">Rename</button>
            <button id="preview-close" type="button" class="preview-action" aria-label="Close preview">Close</button>
          </div>
        </div>
        <div id="preview-notice" class="preview-notice hidden"></div>
        <div id="preview-summary" class="preview-summary hidden"></div>
        <div id="preview-messages" class="preview-messages"></div>
      </div>
    </div>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
