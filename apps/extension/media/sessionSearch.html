<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{cspSource}}; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <link rel="stylesheet" href="{{markdownStyleUri}}" />
  </head>
  <body>
    <div class="panel">
      <section class="controls-card">
        <div class="search-bar-row">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.35" />
              <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
            </svg>
            <input
              id="search"
              class="search"
              type="text"
              placeholder="Search sessions, ACP chats, notes & conversation text..."
              spellcheck="false"
            />
            <button id="search-clear" type="button" class="search-clear hidden" aria-label="Clear search">×</button>
          </div>
          <div class="index-status-wrap">
            <span id="index-status" class="index-status"></span>
            <button
              id="sync-index-btn"
              type="button"
              class="sync-index-btn"
              title="Refresh full-text search index"
              aria-label="Refresh full-text search index"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M13.25 8a5.25 5.25 0 1 1-1.54-3.71" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
                <path d="M13.5 2.5v2.75H10.75" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </div>

        <div class="filters-row">
          <section class="projects-section">
            <div class="projects-header">
              <span class="section-label">Projects</span>
              <div id="project-dropdown" class="project-dropdown">
                <button
                  id="project-dropdown-trigger"
                  type="button"
                  class="project-dropdown-trigger"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                >
                  <span id="project-dropdown-label" class="project-dropdown-label">All Projects</span>
                  <span class="project-dropdown-caret" aria-hidden="true">▾</span>
                </button>
                <div id="project-dropdown-menu" class="project-dropdown-menu hidden" role="dialog">
                  <div class="project-dropdown-search-wrap">
                    <input
                      id="project-dropdown-search"
                      class="project-dropdown-search"
                      type="text"
                      placeholder="Filter projects by name or path..."
                      spellcheck="false"
                    />
                  </div>
                  <div id="project-dropdown-list" class="project-dropdown-list" role="listbox"></div>
                </div>
              </div>
              <button id="project-clear-btn" type="button" class="project-clear-btn hidden" title="Clear project filter">×</button>
            </div>
            <div id="chips" class="chips project-shortcuts"></div>
          </section>

          <section class="gtd-section">
            <div id="gtd-section-label" class="section-label">GTD</div>
            <div id="gtd-chips" class="chips"></div>
          </section>
        </div>
      </section>

      <section class="results-grid" aria-label="Parallel search results">
        <div class="result-column" data-column="session">
          <div class="column-header">
            <span id="col-label-sessions" class="column-title">Sessions</span>
            <span id="col-count-sessions" class="column-count">0</span>
          </div>
          <div id="col-list-sessions" class="column-list"></div>
        </div>

        <div class="result-column" data-column="acp">
          <div class="column-header">
            <span id="col-label-acp" class="column-title">ACP Chats</span>
            <span id="col-count-acp" class="column-count">0</span>
          </div>
          <div id="col-list-acp" class="column-list"></div>
        </div>

        <div class="result-column" data-column="note">
          <div class="column-header">
            <span id="col-label-notes" class="column-title">Notes</span>
            <span id="col-count-notes" class="column-count">0</span>
          </div>
          <div id="col-list-notes" class="column-list"></div>
        </div>
      </section>
    </div>

    <div id="preview-overlay" class="preview-overlay hidden" aria-hidden="true">
      <div class="preview-card">
        <div class="preview-header">
          <div class="preview-header-top">
            <div id="preview-title" class="preview-title"></div>
            <div class="preview-header-controls">
              <button
                id="preview-find-toggle"
                type="button"
                class="preview-find-toggle"
                title="Find in preview (Ctrl+F)"
                aria-label="Find in preview"
                aria-pressed="false"
              >
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.35" />
                  <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
                </svg>
              </button>
              <div id="preview-mode-toggle" class="preview-mode-toggle" role="group" aria-label="Preview display format">
                <button id="preview-mode-markdown" type="button" class="preview-mode-btn active" data-mode="markdown" aria-pressed="true">Markdown</button>
                <button id="preview-mode-raw" type="button" class="preview-mode-btn" data-mode="raw" aria-pressed="false">Raw</button>
              </div>
              <button id="preview-close" type="button" class="preview-action preview-action-close" aria-label="Close preview">Close</button>
            </div>
          </div>
          <div class="preview-actions">
            <button id="preview-resume" type="button" class="preview-action preview-action-primary" aria-label="Resume session">Resume</button>
            <button id="preview-resume-with" type="button" class="preview-action" aria-label="Resume session with">Resume with…</button>
            <button id="preview-summarize" type="button" class="preview-action hidden" aria-label="Summarize session">Summarize</button>
            <button id="preview-auto-rename" type="button" class="preview-action hidden" aria-label="Auto rename session">Auto Rename</button>
            <button id="preview-handoff" type="button" class="preview-action hidden" aria-label="Hand off to another agent">Hand Off to…</button>
            <button id="preview-rename" type="button" class="preview-action" aria-label="Rename session">Rename</button>
          </div>
          <div id="preview-find-bar" class="preview-find-bar hidden" role="search">
            <div class="preview-find-input-wrap">
              <svg class="preview-find-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.35" />
                <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
              </svg>
              <input id="preview-find-input" class="preview-find-input" type="text" placeholder="Find in preview..." spellcheck="false" />
            </div>
            <span id="preview-find-count" class="preview-find-count"></span>
            <button id="preview-find-prev" type="button" class="preview-find-btn" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled>↑</button>
            <button id="preview-find-next" type="button" class="preview-find-btn" title="Next match (Enter)" aria-label="Next match" disabled>↓</button>
            <button id="preview-find-close" type="button" class="preview-find-btn" title="Close find bar (Esc)" aria-label="Close find bar">×</button>
          </div>
        </div>
        <div id="preview-body" class="preview-body">
          <div id="preview-notice" class="preview-notice hidden"></div>
          <div id="preview-summary" class="preview-summary hidden"></div>
          <div id="preview-messages" class="preview-messages"></div>
        </div>
      </div>
    </div>

    <script nonce="{{nonce}}" src="{{markedUri}}"></script>
    <script nonce="{{nonce}}" src="{{purifyUri}}"></script>
    <script nonce="{{nonce}}" src="{{markdownScriptUri}}"></script>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
